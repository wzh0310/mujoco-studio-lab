output_dir: /data/wzh/robot/outputs/ablation_nas4
job_name: ablation_nas4
seed: 1000
resume: false
steps: 1600
batch_size: 16
num_workers: 4
prefetch_factor: 4
persistent_workers: true
log_freq: 20
save_freq: 1600
save_checkpoint: true
eval_steps: 400
max_eval_samples: 0
env_eval_freq: 1000000000
tf32: true
cudnn_deterministic: false
dataset:
